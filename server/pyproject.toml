[project]
name = "dars-api"
version = "0.1.0"
description = "Dars lesson plan service API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "colorlog>=6.10.1",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "anthropic>=0.40.0",
    "bcrypt>=4.0.0,<4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
# Chapter Planner Agents SDK backend (D-10) — development only, lazily imported.
# Never a runtime production dependency; production uses the api_key backend.
planner-agent-sdk = [
    "claude-agent-sdk>=0.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dars"]
artifacts = ["src/dars/migrations/*.sql"]
