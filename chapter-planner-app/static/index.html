<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter Planning Engine — Playground</title>
  <style>
    :root { --fg:#1a1a1a; --muted:#666; --line:#e2e2e2; --accent:#2d6cdf; --bg:#fafafa; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           margin: 0; padding: 2rem; color: var(--fg); background: var(--bg); }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    p.sub { color: var(--muted); margin: 0 0 1.5rem; }
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-items: start; }
    @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }
    label { font-weight: 600; font-size: .85rem; display: block; margin-bottom: .4rem; }
    textarea { width: 100%; height: 460px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
               font-size: .8rem; padding: .75rem; border: 1px solid var(--line); border-radius: 8px;
               resize: vertical; background: #fff; }
    button { margin-top: .75rem; background: var(--accent); color: #fff; border: none; padding: .6rem 1.4rem;
             font-size: .95rem; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .meta { color: var(--muted); font-size: .85rem; margin: 0 0 1rem; }
    .unit { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem;
            margin-bottom: 1rem; }
    .unit-head { display: flex; align-items: center; gap: .6rem; margin-bottom: .5rem; }
    .seq { background: var(--accent); color: #fff; width: 1.7rem; height: 1.7rem; border-radius: 50%;
           display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: .85rem; }
    .lp { font-weight: 700; }
    .pill { display: inline-block; background: #eef3fd; color: var(--accent); border-radius: 999px;
            padding: .1rem .55rem; font-size: .75rem; margin: 0 .25rem .25rem 0; }
    .row { font-size: .85rem; margin: .35rem 0; }
    .row b { color: var(--muted); font-weight: 600; }
    .topictext { white-space: pre-wrap; background: var(--bg); border-radius: 6px; padding: .5rem .6rem;
                 font-size: .8rem; margin-top: .3rem; }
    .rationale { font-style: italic; color: #333; margin-top: .5rem; font-size: .85rem; }
    .err { background: #fdecec; border: 1px solid #f5b5b5; color: #a12020; padding: .75rem 1rem;
           border-radius: 8px; font-size: .85rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Chapter Planning Engine</h1>
  <p class="sub">Phase 1 playground — POSTs to <code>/plan</code> (deterministic stub).</p>

  <div class="layout">
    <div>
      <label for="req">Plan request (JSON)</label>
      <textarea id="req"></textarea>
      <button id="go">Plan</button>
    </div>
    <div>
      <label>Result</label>
      <div id="out"><p class="meta">Click “Plan” to see the units.</p></div>
    </div>
  </div>

  <script>
    const SAMPLE = {
      subject: "Eng",
      grade: 1,
      curriculum: "ICT",
      period_count: 3,
      chapter: {
        title: "Chapter 1 — Myself",
        topics: [
          {
            id: "t1",
            topic_text: "Greetings and introductions. Saying hello, good morning, and goodbye to friends and teachers.",
            slos: [
              { id: "s1", statement: "Student can greet others appropriately." },
              { id: "s2", statement: "Student can state their own name." }
            ]
          },
          {
            id: "t2",
            topic_text: "My family. Naming family members — mother, father, sister, brother — and describing who they are.",
            slos: [
              { id: "s3", statement: "Student can name immediate family members." },
              { id: "s4", statement: "Student can describe a family member in a short sentence." }
            ]
          },
          {
            id: "t3",
            topic_text: "Grammar focus: Adverbs of Time (now, today, tomorrow, yesterday) used in simple daily-routine sentences.",
            slos: [
              { id: "s5", statement: "Student can identify adverbs of time in a sentence." },
              { id: "s6", statement: "Student can use 'Adverbs of Time' correctly in a simple sentence." }
            ]
          }
        ]
      }
    };

    const reqEl = document.getElementById("req");
    const outEl = document.getElementById("out");
    const goEl  = document.getElementById("go");
    reqEl.value = JSON.stringify(SAMPLE, null, 2);

    function esc(s) {
      return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    }

    function render(plan) {
      const head = `<p class="meta">${esc(plan.subject)} · Grade ${esc(plan.grade)} · ${esc(plan.curriculum)} · ${plan.units.length} unit(s)</p>`;
      const units = plan.units.map(u => `
        <div class="unit">
          <div class="unit-head">
            <span class="seq">${esc(u.sequence)}</span>
            <span class="lp">${esc(u.lp_type)}</span>
          </div>
          <div class="row"><b>Topics:</b> ${u.topic_ids.map(t => `<span class="pill">${esc(t)}</span>`).join("") || "—"}</div>
          <div class="row"><b>SLOs:</b> ${u.slo_ids.map(s => `<span class="pill">${esc(s)}</span>`).join("") || "—"}</div>
          <div class="topictext">${esc(u.topic_text || "—")}</div>
          <div class="rationale">${esc(u.rationale || "")}</div>
        </div>`).join("");
      outEl.innerHTML = head + units;
    }

    async function plan() {
      let body;
      try { body = JSON.parse(reqEl.value); }
      catch (e) { outEl.innerHTML = `<div class="err">Invalid JSON: ${esc(e.message)}</div>`; return; }

      goEl.disabled = true;
      outEl.innerHTML = `<p class="meta">Planning…</p>`;
      try {
        const res = await fetch("/plan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) {
          outEl.innerHTML = `<div class="err">HTTP ${res.status}\n${esc(JSON.stringify(data, null, 2))}</div>`;
        } else {
          render(data);
        }
      } catch (e) {
        outEl.innerHTML = `<div class="err">Request failed: ${esc(e.message)}</div>`;
      } finally {
        goEl.disabled = false;
      }
    }

    goEl.addEventListener("click", plan);
  </script>
</body>
</html>
