<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter Planning Engine</title>
  <style>
    :root { --fg:#1a1a1a; --muted:#666; --line:#e2e2e2; --accent:#2d6cdf; --bg:#fafafa;
            --ok:#138a36; --err:#c0392b; --chip:#eef3fd; }
    * { box-sizing: border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
           margin:0; padding:2rem; color:var(--fg); background:var(--bg); }
    h1 { font-size:1.5rem; margin:0 0 .25rem; }
    p.sub { color:var(--muted); margin:0 0 1.5rem; }
    .wrap { max-width:980px; margin:0 auto; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:12px;
             padding:1.25rem 1.4rem; margin-bottom:1.25rem; }
    label { font-weight:600; font-size:.8rem; display:block; margin-bottom:.35rem; color:var(--muted);
            text-transform:uppercase; letter-spacing:.03em; }
    select, input[type=number] { width:100%; padding:.55rem .65rem; border:1px solid var(--line);
            border-radius:8px; font-size:.95rem; background:#fff; }
    .row { display:flex; gap:1rem; flex-wrap:wrap; }
    .row > div { flex:1; min-width:200px; }
    button { background:var(--accent); color:#fff; border:none; padding:.6rem 1.4rem;
             font-size:.95rem; border-radius:8px; cursor:pointer; font-weight:600; }
    button:disabled { opacity:.5; cursor:default; }
    button.ghost { background:#fff; color:var(--accent); border:1px solid var(--accent); }
    .chapters { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:.6rem; }
    .chip { border:1px solid var(--line); border-radius:10px; padding:.7rem .8rem; cursor:pointer;
            background:#fff; transition:.12s; }
    .chip:hover { border-color:var(--accent); }
    .chip.sel { border-color:var(--accent); background:var(--chip); }
    .chip .n { font-weight:700; color:var(--accent); }
    .chip .t { font-weight:600; margin:.15rem 0; }
    .chip .c { font-size:.8rem; color:var(--muted); }
    details.topic { border:1px solid var(--line); border-radius:10px; padding:.6rem .8rem; margin-bottom:.6rem; }
    details.topic summary { cursor:pointer; font-weight:600; }
    .slo { font-size:.88rem; padding:.3rem 0 .3rem .6rem; border-left:3px solid var(--chip);
           margin:.3rem 0 .3rem .4rem; color:#333; }
    pre.tt { white-space:pre-wrap; background:var(--bg); border-radius:8px; padding:.6rem .8rem;
             font-size:.82rem; margin:.5rem 0; color:#444; }
    .unit { border:1px solid var(--line); border-radius:12px; padding:1rem 1.1rem; margin-bottom:.9rem; background:#fff; }
    .unit-head { display:flex; align-items:center; gap:.7rem; margin-bottom:.55rem; flex-wrap:wrap; }
    .seq { background:var(--accent); color:#fff; width:1.8rem; height:1.8rem; border-radius:50%;
           display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem; }
    .badge { background:var(--chip); color:var(--accent); border-radius:999px; padding:.2rem .7rem;
             font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.02em; }
    .unit .meta { font-size:.82rem; color:var(--muted); margin:.2rem 0; }
    .unit .rat { font-size:.9rem; margin-top:.4rem; }
    .msg { padding:.7rem .9rem; border-radius:8px; font-size:.9rem; margin:.6rem 0; }
    .msg.err { background:#fdecea; color:var(--err); border:1px solid #f5c6c0; }
    .msg.info { background:var(--chip); color:var(--accent); }
    .spin { display:inline-block; width:1rem; height:1rem; border:2px solid #fff; border-top-color:transparent;
            border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:.4rem; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .hidden { display:none; }
    pre.raw { background:#1a1a1a; color:#e6e6e6; padding:1rem; border-radius:10px; overflow:auto; font-size:.78rem; }
    .small { font-size:.8rem; color:var(--muted); }
    .unit-actions { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.6rem; }
    .unit-actions button { padding:.45rem 1rem; font-size:.85rem; }
    details.showtext { border:1px solid var(--line); border-radius:8px; padding:.4rem .7rem; margin-top:.6rem; }
    details.showtext summary { cursor:pointer; font-weight:600; font-size:.85rem; color:var(--accent); }
    .lp-panel { border:1px solid var(--line); border-radius:10px; margin-top:.7rem; overflow:hidden; }
    .lp-bar { display:flex; justify-content:space-between; align-items:center; padding:.5rem .8rem;
              background:var(--chip); }
    .lp-bar .small { margin:0; }
    .lp-body { padding:1rem; background:#fff; max-height:600px; overflow:auto; }
    .lp-raw { white-space:pre-wrap; background:#1a1a1a; color:#e6e6e6; padding:1rem; font-size:.75rem;
              max-height:600px; overflow:auto; margin:0; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Chapter Planning Engine</h1>
  <p class="sub">Pick a real English chapter from staging, review the source topics + sub-SLOs, then let the LLM plan its Plan Units. Nothing is persisted.</p>

  <div class="panel">
    <div class="row">
      <div>
        <label for="book">Book</label>
        <select id="book"><option>Loading…</option></select>
      </div>
      <div>
        <label for="period">Period count</label>
        <input type="number" id="period" min="1" value="3" />
      </div>
    </div>
    <div id="bookMsg"></div>
  </div>

  <div class="panel hidden" id="chaptersPanel">
    <label>Chapter</label>
    <div class="chapters" id="chapters"></div>
    <div style="margin-top:1rem">
      <button id="loadBtn" disabled>Load chapter</button>
    </div>
  </div>

  <div class="panel hidden" id="inputPanel">
    <label>Resolved chapter (this is the plan input)</label>
    <h3 id="chTitle" style="margin:.2rem 0 .8rem"></h3>
    <div id="topics"></div>
    <div style="margin-top:1rem">
      <button id="planBtn">Plan it</button>
      <span class="small">LLM call, takes ~10–20s</span>
    </div>
    <div id="planMsg"></div>
  </div>

  <div class="panel hidden" id="planPanel">
    <div style="display:flex; justify-content:space-between; align-items:center">
      <label style="margin:0">Plan</label>
      <button class="ghost" id="rawToggle">Show raw JSON</button>
    </div>
    <div id="units" style="margin-top:.8rem"></div>
    <pre class="raw hidden" id="raw"></pre>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let chapters = [], selectedChapter = null, planInput = null, lastPlan = null;

function msg(el, text, kind) {
  el.innerHTML = text ? `<div class="msg ${kind||'info'}">${text}</div>` : '';
}

async function jget(url) {
  const r = await fetch(url);
  if (!r.ok) { const b = await r.json().catch(()=>({})); throw new Error(b.detail || r.statusText); }
  return r.json();
}

async function loadBooks() {
  try {
    const books = await jget('/books');
    const sel = $('#book');
    sel.innerHTML = '';
    books.forEach(b => {
      const o = document.createElement('option');
      o.value = b.id;
      o.textContent = `${b.title} (G${b.grade}, ${b.total_chapters} ch)`;
      sel.appendChild(o);
    });
    if (books.length) { sel.value = books[0].id; loadChapters(); }
  } catch (e) { msg($('#bookMsg'), 'Could not load books: ' + e.message, 'err'); }
}

async function loadChapters() {
  const bookId = $('#book').value;
  selectedChapter = null; $('#loadBtn').disabled = true;
  $('#inputPanel').classList.add('hidden'); $('#planPanel').classList.add('hidden');
  try {
    chapters = await jget(`/books/${bookId}/chapters`);
    const c = $('#chapters'); c.innerHTML = '';
    chapters.forEach(ch => {
      const d = document.createElement('div');
      d.className = 'chip';
      d.innerHTML = `<div class="n">Ch ${ch.chapter_number}</div><div class="t">${ch.title}</div><div class="c">${ch.topic_count} topic${ch.topic_count===1?'':'s'}</div>`;
      d.onclick = () => selectChapter(ch, d);
      c.appendChild(d);
    });
    $('#chaptersPanel').classList.remove('hidden');
  } catch (e) { msg($('#bookMsg'), 'Could not load chapters: ' + e.message, 'err'); }
}

function selectChapter(ch, el) {
  selectedChapter = ch;
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('sel'));
  el.classList.add('sel');
  $('#loadBtn').disabled = false;
  if (ch.topic_count > 0) $('#period').value = ch.topic_count;
}

async function loadInput() {
  if (!selectedChapter) return;
  const bookId = $('#book').value;
  const period = Math.max(1, parseInt($('#period').value || '1', 10));
  $('#planPanel').classList.add('hidden');
  try {
    planInput = await jget(`/books/${bookId}/chapters/${selectedChapter.id}/plan-input?period_count=${period}&subject=Eng`);
    $('#chTitle').textContent = planInput.chapter.title;
    const t = $('#topics'); t.innerHTML = '';
    planInput.chapter.topics.forEach((tp, i) => {
      const d = document.createElement('details'); d.className = 'topic';
      const slos = tp.slos.map(s => `<div class="slo">${s.statement}</div>`).join('');
      d.innerHTML = `<summary>${tp.title || ('Topic ' + (i+1))} — ${tp.slos.length} sub-SLO${tp.slos.length===1?'':'s'}</summary>`
        + `<pre class="tt">${(tp.topic_text||'').replace(/</g,'&lt;')}</pre>` + slos;
      t.appendChild(d);
    });
    $('#inputPanel').classList.remove('hidden');
    msg($('#planMsg'), '');
  } catch (e) { msg($('#bookMsg'), 'Could not load chapter: ' + e.message, 'err'); }
}

async function planIt() {
  if (!planInput) return;
  const btn = $('#planBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Planning…';
  msg($('#planMsg'), '<span class="spin"></span>Calling the planner LLM (~10–20s)…', 'info');
  try {
    const r = await fetch('/plan', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(planInput)
    });
    const body = await r.json();
    if (!r.ok) throw new Error(typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail));
    lastPlan = body;
    renderPlan(body);
    msg($('#planMsg'), '');
  } catch (e) {
    msg($('#planMsg'), 'Plan failed: ' + e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = 'Plan it';
  }
}

function statementsFor(ids) {
  const map = {};
  planInput.chapter.topics.forEach(t => t.slos.forEach(s => map[s.id] = s.statement));
  return ids.map(id => map[id] || id);
}
function topicTitlesFor(ids) {
  const map = {};
  planInput.chapter.topics.forEach((t,i) => map[t.id] = t.title || ('Topic ' + (i+1)));
  return ids.map(id => map[id] || id);
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderPlan(plan) {
  const u = $('#units'); u.innerHTML = '';
  plan.units.forEach(unit => {
    const slos = statementsFor(unit.slo_ids).map(s => `<div class="slo">${s}</div>`).join('');
    const tops = topicTitlesFor(unit.topic_ids).join(', ');
    const d = document.createElement('div'); d.className = 'unit';
    d.innerHTML = `<div class="unit-head"><span class="seq">${unit.sequence}</span>`
      + `<span class="badge">${esc(unit.lp_type)}</span></div>`
      + `<div class="meta"><b>Topics:</b> ${esc(tops)}</div>`
      + `<div class="meta"><b>SLOs:</b></div>${slos}`
      + `<div class="rat"><b>Rationale:</b> ${esc(unit.rationale)}</div>`
      + `<details class="showtext"><summary>Show Text</summary>`
      + `<pre class="tt">${esc(unit.topic_text)}</pre></details>`
      + `<div class="unit-actions"><button class="genlp">Generate LP</button>`
      + `<span class="small">UG_LP call, ~30–90s</span></div>`
      + `<div class="lp-mount"></div>`;
    d.querySelector('.genlp').onclick = (e) => generateLp(unit, d, e.target);
    u.appendChild(d);
  });
  $('#raw').textContent = JSON.stringify(plan, null, 2);
  $('#planPanel').classList.remove('hidden');
}

async function generateLp(unit, card, btn) {
  const mount = card.querySelector('.lp-mount');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Generating…';
  mount.innerHTML = `<div class="msg info"><span class="spin"></span>Calling UG_LP (~30–90s)…</div>`;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 180000);
  try {
    const r = await fetch('/generate-lp-for-unit', {
      method: 'POST', headers: {'Content-Type':'application/json'}, signal: ctrl.signal,
      body: JSON.stringify({
        subject: lastPlan.subject, grade: lastPlan.grade,
        curriculum: lastPlan.curriculum, unit
      })
    });
    const body = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail));
    renderLp(mount, body.lesson_plan || '');
  } catch (e) {
    const m = e.name === 'AbortError' ? 'timed out after 180s' : e.message;
    mount.innerHTML = `<div class="msg err">LP generation failed: ${esc(m)}</div>`;
  } finally {
    clearTimeout(timer);
    btn.disabled = false; btn.textContent = 'Generate LP';
  }
}

function renderLp(mount, html) {
  mount.innerHTML = `<div class="lp-panel">`
    + `<div class="lp-bar"><span class="small"><b>Lesson plan</b></span>`
    + `<button class="ghost lp-toggle">Show raw</button></div>`
    + `<div class="lp-body"></div>`
    + `<pre class="lp-raw hidden"></pre></div>`;
  // Render the HTML fragment sandboxed in an iframe (contained, no app CSS bleed).
  const bodyEl = mount.querySelector('.lp-body');
  const frame = document.createElement('iframe');
  frame.setAttribute('sandbox', '');
  frame.style.cssText = 'width:100%;border:0;min-height:480px;';
  bodyEl.appendChild(frame);
  frame.srcdoc = html;
  mount.querySelector('.lp-raw').textContent = html;
  const tgl = mount.querySelector('.lp-toggle');
  tgl.onclick = () => {
    const raw = mount.querySelector('.lp-raw');
    const hidden = raw.classList.toggle('hidden');
    bodyEl.classList.toggle('hidden', !hidden);
    tgl.textContent = hidden ? 'Show raw' : 'Show rendered';
  };
}

$('#book').onchange = loadChapters;
$('#loadBtn').onclick = loadInput;
$('#planBtn').onclick = planIt;
$('#rawToggle').onclick = () => {
  const raw = $('#raw'); const hidden = raw.classList.toggle('hidden');
  $('#rawToggle').textContent = hidden ? 'Show raw JSON' : 'Hide raw JSON';
};
loadBooks();
</script>
</body>
</html>
