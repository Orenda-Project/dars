services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=true
    volumes:
      - ./api/src:/app/src  # hot reload in dev
    command: uv run uvicorn dars.main:app --host 0.0.0.0 --port 8000 --reload
